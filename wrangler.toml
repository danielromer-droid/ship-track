# Used by `npx wrangler deploy` and by the GitHub Actions workflow (deploy options 2 and 3 in the README).
name = "ship-track"
main = "dist/worker.js"
compatibility_date = "2025-09-01"
# Keep variables added in the Cloudflare dashboard when deploying from GitHub.
keep_vars = true

# The aisstream.io key is a secret, not a variable: `npx wrangler secret put AISSTREAM_API_KEY`
