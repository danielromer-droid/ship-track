name: Ferry timetables

# Refreshes public/data/ferries.json from the operators' open timetables every Monday.
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: python3 tools/make_ferries.py public/data/ferries.json 2> build.log; cat build.log; while read -r l; do echo "::notice title=ferries::$l"; done < build.log
      - name: Commit
        run: |
          git add public/data/ferries.json
          git diff --cached --quiet && { echo "::notice title=ferries::no change"; exit 0; }
          echo "::notice title=ferries size::$(wc -c < public/data/ferries.json) bytes"
          git config user.name 'ship-track bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Refresh ferry timetables'
          git push
