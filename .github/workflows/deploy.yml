# Deploys the Worker to Cloudflare on every push to main.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  (template "Edit Cloudflare Workers")
#   CLOUDFLARE_ACCOUNT_ID
# and optionally AISSTREAM_API_KEY, which is copied into the Worker as a secret when the workflow is run by hand.
# Pushes skip that step: the secret stays in Cloudflare, and uploading it sometimes failed the deploy.
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the scripts parse
        run: node --check public/app.js && node --check src/worker.js
      - name: Deploy to Cloudflare
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: ${{ github.event_name == 'workflow_dispatch' && env.AISSTREAM_API_KEY != '' && 'AISSTREAM_API_KEY' || '' }}
      - name: Explain the skipped deploy
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy automatically."
