name: Smoke test

# Checks the live site and the services it depends on, from outside Cloudflare.
on:
  workflow_dispatch:
    inputs:
      site:
        description: Site to check
        default: https://ship-track.danielromer.workers.dev

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Live site
        run: |
          site="${{ inputs.site }}"
          echo "::notice title=health::$(curl -sS "$site/api/health")"
          for imo in 9811000 9321483 9706906 9776171; do
            echo "::notice title=photo $imo::$(curl -sS -w ' [%{http_code}]' "$site/api/photo?imo=$imo" | head -c 900)"
          done
      - name: Wikimedia directly
        run: |
          ua='ship-track/1.0 (https://github.com/danielromer-droid/ship-track)'
          echo "::notice title=commons::$(curl -sS -w ' [%{http_code}]' -A "$ua" "https://commons.wikimedia.org/w/api.php?format=json&formatversion=2&action=query&generator=categorymembers&gcmtype=file&gcmlimit=3&gcmtitle=Category:IMO%209811000&prop=imageinfo&iiprop=url|mime&iiurlwidth=800" | head -c 900)"
          echo "::notice title=wikidata::$(curl -sS -w ' [%{http_code}]' -A "$ua" -G "https://query.wikidata.org/sparql" --data-urlencode 'format=json' --data-urlencode 'query=SELECT ?img WHERE { ?ship wdt:P458 "9811000"; wdt:P18 ?img } LIMIT 1' | tr -d '\n' | head -c 600)"
