name: Smoke test

# Checks the live site and the services it depends on, from outside Cloudflare.
on:
  workflow_dispatch:
    inputs:
      site:
        description: Site to check
        default: https://ship-track.danielromer.workers.dev

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Live site
        run: |
          site="${{ inputs.site }}"
          echo "::notice title=health::$(curl -sS "$site/api/health")"
          for imo in 9811000 9321483 9706906 9776171 9839131 9454436 9708837; do
            echo "::notice title=photo $imo::$(curl -sS -w ' [%{http_code}]' "$site/api/photo?imo=$imo" | head -c 900)"
          done
          for name in "MSC%20GULSUN" "PRIDE%20OF%20KENT" "STENA%20BRITANNICA" "SPIRIT%20OF%20BRITAIN" "MOBY%20WONDER"; do
            echo "::notice title=photo by name $name::$(curl -sS -w ' [%{http_code}]' "$site/api/photo?name=$name" | head -c 900)"
          done
      - name: Wikimedia directly
        run: |
          ua='ship-track/1.0 (https://github.com/danielromer-droid/ship-track)'
          echo "::notice title=commons::$(curl -sS -w ' [%{http_code}]' -A "$ua" "https://commons.wikimedia.org/w/api.php?format=json&formatversion=2&action=query&generator=categorymembers&gcmtype=file&gcmlimit=3&gcmtitle=Category:IMO%209811000&prop=imageinfo&iiprop=url|mime&iiurlwidth=800" | head -c 900)"
          echo "::notice title=wikidata::$(curl -sS -w ' [%{http_code}]' -A "$ua" -G "https://query.wikidata.org/sparql" --data-urlencode 'format=json' --data-urlencode 'query=SELECT ?img WHERE { ?ship wdt:P458 "9811000"; wdt:P18 ?img } LIMIT 1' | tr -d '\n' | head -c 600)"
      - name: Extra feeds through the site
        run: |
          curl -sS "${{ inputs.site }}/api/extra?box=59,22,61,27" -o extra.json -w '%{http_code}\n'
          echo "::notice title=site extra::$(jq -c '{n: (.messages|length), types: ([.messages[].MessageType] | group_by(.) | map({(.[0]): length}) | add), sample: .messages[1]}' extra.json | head -c 1500)"
      - name: Ship lookup by IMO
        run: |
          for imo in 9866689 9811000; do
            echo "::notice title=ship $imo::$(curl -sS "${{ inputs.site }}/api/ship?imo=$imo" | head -c 500)"
          done
          echo "::notice title=ship by name::$(curl -sS "${{ inputs.site }}/api/ship?name=OSCAR%20WILDE" | head -c 800)"
      - name: Extra free feeds
        run: |
          dt='https://meri.digitraffic.fi/api/ais/v1'
          curl -sS --compressed -H 'Digitraffic-User: ship-track' "$dt/locations" -o loc.json -w '%{http_code} %{size_download}\n'
          echo "::notice title=digitraffic locations::$(jq -c '{type, n: (.features|length), updated: .dataUpdatedTime, first: .features[0]}' loc.json | head -c 1500)"
          curl -sS --compressed -H 'Digitraffic-User: ship-track' "$dt/vessels" -o ves.json
          echo "::notice title=digitraffic vessels::$(jq -c '{n: length, first: .[0]}' ves.json | head -c 1500)"
          echo "::notice title=digitraffic bbox::$(jq -c '[.features[].geometry.coordinates] | {minLon: (map(.[0])|min), maxLon: (map(.[0])|max), minLat: (map(.[1])|min), maxLat: (map(.[1])|max)}' loc.json)"
