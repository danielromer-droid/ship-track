name: Web probe

# Fetches a page from outside the container (whose proxy blocks most sites) and reports whether
# it may be shown in a frame, plus any video or embed links found in it.
on:
  workflow_dispatch:
    inputs:
      url:
        description: Page to fetch
        required: true
      grep:
        description: Extra pattern to look for
        default: 'm3u8|youtube|embed|iframe|player'
      around:
        description: Characters of context to show around each match
        default: '140'
      referer:
        description: Referer to send, as a page framing it would
        default: ''

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch
        env:
          URL: ${{ inputs.url }}
          PAT: ${{ inputs.grep }}
          REF: ${{ inputs.referer }}
          N: ${{ inputs.around }}
        run: |
          code=$(curl -sSL -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/130 Safari/537.36' ${REF:+-e "$REF"} -D h.txt -o p.html -w '%{http_code} %{size_download} %{url_effective}' "$URL")
          echo "::notice title=status::$code"
          echo "::notice title=framing::$(grep -iE '^(x-frame-options|content-security-policy):' h.txt | tr -d '\r' | tr '\n' ' ' | head -c 1500)"
          grep -oiE ".{0,$N}($PAT).{0,$N}" p.html | sort -u | head -40 | while read -r l; do echo "::notice title=match::$(echo "$l" | head -c 4000)"; done
