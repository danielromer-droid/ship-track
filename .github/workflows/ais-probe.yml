name: AIS probe

# Listens to the live feed through the site for a few minutes and reports what a given ship
# actually broadcasts (name, destination, ETA), to tell feed problems from map problems.
on:
  workflow_dispatch:
    inputs:
      ship:
        description: Ship name (or part of it)
        default: DELFT SEAWAYS
      box:
        description: Area as south,west,north,east
        default: 50.5,0.8,51.4,2.6
      imo:
        description: Look this IMO up in the ship registry, then listen for its MMSIs worldwide
        default: ''
      mmsi:
        description: Only this MMSI, anywhere in the world (leave empty to use ship and box)
        default: ''
      minutes:
        description: How long to listen
        default: '8'
      site:
        description: Site to use
        default: https://ship-track.danielromer.workers.dev

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Listen
        env:
          SHIP: ${{ inputs.ship }}
          MMSI: ${{ inputs.mmsi }}
          IMO: ${{ inputs.imo }}
          BOX: ${{ inputs.box }}
          MINUTES: ${{ inputs.minutes }}
          SITE: ${{ inputs.site }}
        run: |
          cat > probe.mjs <<'JS'
          const [s, w, n, e] = process.env.BOX.split(',').map(Number);
          const want = process.env.SHIP.toUpperCase();
          const seen = new Map(), dests = new Map();
          let count = 0, statics = 0;
          const ships = new Map(); // mmsi -> first minute heard
          const t0 = Date.now();
          const ws = new WebSocket(process.env.SITE.replace(/^http/, 'ws') + '/api/stream');
          ws.binaryType = 'arraybuffer';
          ws.onerror = (err) => console.log('::warning::socket error ' + (err.message || ''));
          ws.onclose = (ev) => console.log(`::warning::socket closed ${ev.code} ${ev.reason}`);
          const list = (process.env.MMSI || '').split(',').map(Number).filter(Boolean);
          if (process.env.IMO) {
            const reg = await (await fetch(`${process.env.SITE}/api/ship?imo=${process.env.IMO}`)).json();
            console.log(`::notice title=registry IMO ${process.env.IMO}::${JSON.stringify(reg).slice(0, 900)}`);
            for (const v of reg.ships || []) if (v.mmsi) list.push(v.mmsi);
            if (!reg.ships && reg.mmsi) list.push(reg.mmsi);
          }
          const only = list[0] || 0;
          let hits = 0;
          ws.onopen = () => ws.send(JSON.stringify(only ? { boxes: [[[-90, -180], [90, 180]]], mmsi: list } : { boxes: [[[s, w], [n, e]]] }));
          ws.onmessage = (ev) => {
            const m = JSON.parse(typeof ev.data === 'string' ? ev.data : new TextDecoder().decode(ev.data));
            if (m.error) console.log('::warning::' + m.error);
            count++;
            if (m.MetaData?.MMSI && !ships.has(m.MetaData.MMSI)) ships.set(m.MetaData.MMSI, Math.floor((Date.now() - t0) / 60000));
            if (count <= 2) console.log(`::notice title=message ${count}::${JSON.stringify(m).slice(0, 600)}`);
            if (only) {
              if (list.includes(m.MetaData?.MMSI) && (hits++ < 4 || m.MessageType === 'ShipStaticData')) console.log(`::notice title=${m.MetaData.MMSI} ${m.MessageType}::${JSON.stringify(m.MessageType === 'ShipStaticData' ? m.Message.ShipStaticData : m.MetaData).slice(0, 600)}`);
              return;
            }
            const name = (m.MetaData?.ShipName || '').trim().toUpperCase();
            const body = m.Message?.ShipStaticData;
            if (!body && name.includes(want) && !seen.has('pos' + m.MetaData.MMSI)) {
              seen.set('pos' + m.MetaData.MMSI, 1);
              console.log(`::notice title=${name} position (${m.MetaData.MMSI})::${m.MessageType} ${JSON.stringify(m.MetaData).slice(0, 300)}`);
            }
            if (body) { statics++; if (dests.size < 40) dests.set(name, body.Destination); }
            if (!body || !name.includes(want)) return;
            const key = `${m.MetaData.MMSI}|${JSON.stringify(body.Destination)}`;
            if (seen.has(key)) return;
            seen.set(key, 1);
            console.log(`::notice title=${name} (${m.MetaData.MMSI})::Destination=${JSON.stringify(body.Destination)} ETA=${JSON.stringify(body.Eta)} IMO=${body.ImoNumber}`);
          };
          setTimeout(() => {
            if (only && !hits) console.log(`::notice title=nothing::No message from MMSI ${only} anywhere in ${process.env.MINUTES} min`);
            if (!only && !seen.size) console.log(`::notice title=nothing::No static message from ${want} in ${process.env.MINUTES} min`);
            console.log(`::notice title=totals::${count} messages, ${statics} static messages`);
            const byMin = [...ships.values()].reduce((a, v) => { a[v] = (a[v] || 0) + 1; return a; }, {});
            console.log(`::notice title=distinct ships::${ships.size} ships heard; new ships per minute ${JSON.stringify(byMin)}`);
            console.log(`::notice title=sample destinations::${[...dests].map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(' | ')}`);
            process.exit(0);
          }, process.env.MINUTES * 60_000);
          JS
          node probe.mjs
