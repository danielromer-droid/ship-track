<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Ship Track</title>
  <meta name="description" content="Live map of ships around the world">
  <meta name="theme-color" content="#FFFFFF" id="theme-color">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ship Track">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <script>
    // Apply a saved light/dark choice before the page paints, so it never flashes.
    try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <a class="brand" href="/" aria-label="Ship Track home">
      <img src="icons/icon.svg" width="30" height="30" alt="">
      <span>Ship Track</span>
    </a>

    <div class="search" role="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" autocomplete="off" placeholder="Ship, MMSI, IMO or port" aria-label="Search a ship name, MMSI, IMO number or a port" aria-controls="results">
      <kbd>/</kbd>
      <ul id="results" class="results" hidden></ul>
    </div>

    <button type="button" id="theme" class="theme-btn" aria-label="Theme: automatic" title="Theme: automatic"></button>

    <nav class="chips" id="chips" aria-label="Ship types"></nav>
  </header>

  <div class="body">
    <aside id="panel" class="panel" aria-label="Ship details" hidden></aside>
    <main class="mapwrap">
      <div id="map"></div>
      <ul class="legend" aria-label="Legend">
        <li><svg class="shape" width="12" height="16" viewBox="0 0 12 16" aria-hidden="true"><path d="M6 1C9 3 10 5 10 7v6.5Q10 15 8.5 15h-5Q2 15 2 13.5V7c0-2 1-4 4-6z" fill="currentColor"/></svg>Under way</li>
        <li><svg class="shape" width="12" height="16" viewBox="0 0 12 16" aria-hidden="true"><path d="M6 1C9 3 10 5 10 7v6.5Q10 15 8.5 15h-5Q2 15 2 13.5V7c0-2 1-4 4-6z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>Anchored or moored</li>
        <li class="unknown"><svg class="shape" width="12" height="16" viewBox="0 0 12 16" aria-hidden="true"><path d="M6 1C9 3 10 5 10 7v6.5Q10 15 8.5 15h-5Q2 15 2 13.5V7c0-2 1-4 4-6z" fill="currentColor"/></svg>Type not sent yet</li>
        <li><svg class="shape" width="16" height="12" viewBox="0 0 16 12" aria-hidden="true"><path d="M1 6h14" stroke="currentColor" stroke-width="2" stroke-dasharray="3 2.5"/></svg>Route to destination</li>
      </ul>

      <div id="following" class="following" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
        <span>Following <strong id="following-name"></strong></span>
        <button type="button" id="unfollow" aria-label="Stop following">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div id="weather" class="weather" aria-live="polite" hidden></div>
      <div id="status" class="status" role="status">Connecting to ships…</div>
    </main>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="app.js"></script>
</body>
</html>
